<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ExamSphere - The Complete Examination Management Ecosystem. Assess Smarter. Perform Better." />
    <meta name="theme-color" content="#0b0e21" />
    <title>ExamSphere</title>
    <!-- Display serif used only for hero accents. Optional: if it cannot load (offline demo) the page falls back to Georgia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so there is no light flash in dark mode.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('examsphere:prefs') || '{}');
          var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (p.reduceMotion) document.documentElement.classList.add('reduce-motion');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
